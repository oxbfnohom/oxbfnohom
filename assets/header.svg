<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="oxbfnohome: agents, autonomous, tools">
  <defs>
    <radialGradient id="nebA" cx="0.2" cy="0.7" r="0.8">
      <stop offset="0" stop-color="#0A7BC8" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#124B78" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#05070B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebB" cx="0.78" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#6B4BD1" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#1B3E73" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#05070B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebC" cx="0.55" cy="1.0" r="0.6">
      <stop offset="0" stop-color="#12B5C9" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#05070B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EAF6FF"/>
      <stop offset="0.55" stop-color="#9FD8F7"/>
      <stop offset="1" stop-color="#2E9BE0"/>
    </linearGradient>
    <linearGradient id="winTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F1727" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#0A101B" stop-opacity="0.95"/>
    </linearGradient>
    <style>
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.22} }
      .cursor{animation:blink 1.1s steps(1) infinite}
      .dot{animation:pulse 2.4s ease-in-out infinite}
      .d2{animation-delay:.4s} .d3{animation-delay:.8s}
      @keyframes gl1 {
        0%,83.5% {opacity:0; transform:translateX(0)}
        84.2% {opacity:.9; transform:translateX(-8px)}
        85.6% {opacity:.9; transform:translateX(6px)}
        87.0% {opacity:.85; transform:translateX(-5px)}
        88.4% {opacity:.9; transform:translateX(7px)}
        90.0% {opacity:0; transform:translateX(0)}
        100% {opacity:0}
      }
      @keyframes gl2 {
        0%,83.8% {opacity:0; transform:translateX(0)}
        84.6% {opacity:.9; transform:translateX(9px)}
        86.0% {opacity:.9; transform:translateX(-7px)}
        87.4% {opacity:.85; transform:translateX(8px)}
        88.8% {opacity:.9; transform:translateX(-9px)}
        90.4% {opacity:0; transform:translateX(0)}
        100% {opacity:0}
      }
      @keyframes retryblink { 0%,45%{opacity:.3} 50%,95%{opacity:1} 100%{opacity:.3} }
      .g1{animation:gl1 7s linear infinite}
      .g2{animation:gl2 7s linear infinite}
      .retry{animation:retryblink 1.4s steps(1) infinite}
      @media (prefers-reduced-motion: reduce){ .cursor,.dot,.g1,.g2,.retry{animation:none} .g1,.g2{opacity:0} }
    </style>
  </defs>

