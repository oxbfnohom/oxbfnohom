<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="oxbfnohome: agents, autonomous, tools">
  <defs>
    <linearGradient id="hairGlow" x1="0" y1="0" x2="0.85" y2="0.6">
      <stop offset="0" stop-color="#0A7BC8" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#0A7BC8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#06070A" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9BD8F8">
        <animate attributeName="stop-color" values="#9BD8F8;#2E9BE0;#0A7BC8;#9BD8F8" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#2E9BE0"/>
      <stop offset="1" stop-color="#0A7BC8"/>
    </linearGradient>

    <linearGradient id="strand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E9BE0" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#0A7BC8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#BFE6FF" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="typing">
      <rect x="60" y="198" width="0" height="36">
        <animate attributeName="width" from="0" to="720" dur="1.8s" begin="0.4s" fill="freeze"/>
      </rect>
    </clipPath>

    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#1B2233"/>
    </pattern>

    <style>
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }
      @keyframes drift { 0%,100%{opacity:.5} 50%{opacity:.95} }
      @keyframes sweep { 0%{transform:translateX(-460px)} 100%{transform:translateX(1320px)} }
      @keyframes scan  { 0%{transform:translateY(70px);opacity:0} 12%{opacity:.45} 88%{opacity:.2} 100%{transform:translateY(318px);opacity:0} }
      .cursor{animation:blink 1.1s steps(1) infinite}
      .dot{animation:pulse 2.4s ease-in-out infinite}
      .d2{animation-delay:.4s} .d3{animation-delay:.8s}
      .strand{animation:drift 6s ease-in-out infinite}
      .sheen{animation:sweep 7.5s linear infinite}
      .scan{animation:scan 9s linear infinite}
      @media (prefers-reduced-motion: reduce){
        .cursor,.dot,.strand,.sheen,.scan{animation:none}
      }
    </style>
  </defs>

  <rect width="1280" height="320" fill="#06070A"/>
  <rect width="1280" height="320" fill="url(#dots)" opacity="0.5"/>
  <rect width="1280" height="320" fill="url(#hairGlow)"/>

  <g stroke="url(#strand)" stroke-linecap="round" fill="none">
    <path class="strand" d="M-40 300C120 250 210 150 240 -20" stroke-width="2"/>
    <path class="strand" style="animation-delay:1.2s" d="M10 320C170 260 260 160 300 -30" stroke-width="1.4"/>
    <path class="strand" style="animation-delay:2.4s" d="M70 330C220 270 310 170 350 -40" stroke-width="1"/>
  </g>

  <g class="sheen"><rect x="0" y="0" width="460" height="320" fill="url(#sheen)"/></g>
  <rect class="scan" x="0" y="0" width="1280" height="1" fill="#2E9BE0" opacity="0.3"/>

  <rect x="0" y="0" width="5" height="320" fill="#0A7BC8"/>

  <g>
    <circle cx="44" cy="34" r="5" fill="#243043"/>
    <circle cx="64" cy="34" r="5" fill="#243043"/>
    <circle cx="84" cy="34" r="5" fill="#243043"/>
    <line x1="0" y1="58" x2="1280" y2="58" stroke="#151A26" stroke-width="1"/>
  </g>

  <g font-family="Consolas, Menlo, monospace">
    <text x="64" y="106" font-size="15" fill="#6C7A96">oxbfnohome@local:~$ <tspan fill="#E8EEF8" font-weight="700">whoami</tspan></text>
    <rect class="cursor" x="306" y="92" width="8" height="16" fill="#2E9BE0"/>

    <text x="60" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="-1.5" fill="url(#nameFill)">oxbfnohome</text>

    <text clip-path="url(#typing)" x="64" y="226" font-size="23" font-weight="700" fill="#2E9BE0">agents · autonomous · tools</text>
    <text x="64" y="254" font-size="15" fill="#7F8CA6">agent systems that keep running after I close the laptop</text>

    <g font-size="13" fill="#5F6A80">
      <circle class="dot" cx="66" cy="292" r="3.5" fill="#0A7BC8"/>
      <text x="80" y="296">agent orchestration</text>
      <circle class="dot d2" cx="262" cy="292" r="3.5" fill="#0A7BC8"/>
      <text x="276" y="296">local models</text>
      <circle class="dot d3" cx="404" cy="292" r="3.5" fill="#0A7BC8"/>
      <text x="418" y="296">runs unattended</text>
    </g>
  </g>

  <text x="1232" y="296" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="11" letter-spacing="2" fill="#2B3548">SINCE 2025</text>
</svg>
