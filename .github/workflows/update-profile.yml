name: Update profile README

# Keeps the repository list on the profile README in sync with the account:
# push a new public repo and it shows up here on the next run.
on:
  schedule:
    - cron: "17 */2 * * *" # every 2 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_readme.py"
      - "assets/**"

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate the generated blocks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_readme.py

      - name: Commit when something changed
        run: |
          if [ -z "$(git status --porcelain README.md)" ]; then
            echo "README sudah terbaru -- tidak ada commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Profile: refresh repository list [skip ci]"
          git push
